services:
  kaori-router:
    image: ${CLI_PROXY_IMAGE:-shunsuiext/kaori-router:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: kaori-router
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/KaoriRouter/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.kaori-router
      - ${CLI_PROXY_LOG_PATH:-./logs}:/KaoriRouter/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/KaoriRouter/plugins
    restart: unless-stopped
