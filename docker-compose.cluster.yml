services:
  kaori-router-cluster:
    image: ${CLI_PROXY_IMAGE:-shunsuiext/kaori-router:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: kaori-router-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.kaori-router
      - ${CLI_PROXY_LOG_PATH:-./logs}:/KaoriRouter/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/KaoriRouter/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./KaoriRouter -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
